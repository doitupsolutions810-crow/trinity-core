apiVersion: apps/v1
kind: Deployment
metadata:
  name: trinity-core
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: trinity-core
  template:
    metadata:
      labels:
        app: trinity-core
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: trinity-core
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: trinity-core-config
            - secretRef:
                name: trinity-core-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
